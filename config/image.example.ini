[DEFAULT]

# Windows 安装 ISO 或 install.wim
wim_file_path=__WIM_PATH__

# 必须与 Get-WimFileImagesInfo 显示的名称完全相同
image_name=Windows 11 Pro for Workstations

# 最终输出
image_path=__OUTPUT_PATH__

# KVM 会最终转换为 QCOW2
virtual_disk_format=QCOW2
image_type=KVM

# Windows 11 / Proxmox 使用 UEFI
disk_layout=UEFI

product_key=""

force=False
install_maas_hooks=False
compression_format=""

# PVE 模板建议压缩 qcow2
compress_qcow2=True

# 是否缩小最终系统盘
shrink_image_to_minimum_size=False
zero_unused_volume_sectors=False

# 启用内置 Administrator
enable_administrator_account=True
disable_first_logon_animation=True

# 壁纸设置
enable_custom_wallpaper=False
wallpaper_path=""
wallpaper_solid_color=""

enable_shutdown_without_logon=True
enable_ping_requests=True
enable_ipv6_eui64=False
enable_active_mode=True

# 客户机软件安装和 Sysprep 脚本
custom_scripts_path=__PROJECT_ROOT__\hooks
custom_resources_path=__STAGED_RESOURCES__

[vm]

# 构建阶段的临时 Administrator 密码
administrator_password=__EPHEMERAL_BUILD_PASSWORD__

cpu_count=4

# 8 GiB
ram_size=8589934592

# 128 GiB
disk_size=137438953472

# Hyper-V 外部交换机名称
external_switch=external

# UEFI + Secure Boot
disable_secure_boot=False

[drivers]

# VirtIO ISO
virtio_iso_path=__ASSET_ROOT__\iso\virtio-win.iso

virtio_base_path=""
drivers_path=""

[custom]

# QGA 由 virtio-win-guest-tools 安装
install_qemu_ga=False

# Windows 时区 ID，默认美国纽约时间（自动处理夏令时），可在向导中更改
time_zone=Eastern Standard Time
ntp_servers=""

[updates]

# 是否安装 Windows Update
install_updates=False

# 是否清理更新文件
purge_updates=False

clean_updates_offline=False
clean_updates_online=False

[sysprep]

run_sysprep=True
unattend_xml_path=UnattendTemplate.xml

disable_swap=True

# KVM/VirtIO 模板需要保留驱动
persist_drivers_install=True

[cloudbase_init]

# 使用稳定版 Cloudbase-Init
beta_release=False

serial_logging_port=COM1

# 按客户资源目录展开；构建时自动下载到缓存，后续直接复用
msi_path=__ASSET_ROOT__\assets\CloudbaseInitSetup_Stable_x64.msi

# 使用为 PVE 准备的配置
cloudbase_init_config_path=__PROJECT_ROOT__\config\cloudbase-init.conf
cloudbase_init_unattended_config_path=""

cloudbase_init_use_local_system=False
cloudbase_init_delayed_start=False
